<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCR 互动页面</title>
  <style>
    :root {
      --bg: #edf2ff;
      --card: #ffffff;
      --line: #d8deea;
      --text: #1f2a44;
      --primary: #2f6df6;
      --ok: #1f9d5c;
      --muted: #6c7794;
      --danger: #d14343;
      --danger-bg: #fff2f2;

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #f5f8ff 0%, var(--bg) 45%, #eef3ff 100%);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px;
      padding: 20px;
      min-height: 100vh;
    }

    .left,
    .right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(52, 78, 146, 0.08);
    }

    h2,
    h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .page-title {
      background: linear-gradient(120deg, #2f6df6 0%, #5f8dff 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      border: none;
    }

    .hidden {
      display: none;
    }

    .dna-block {
      border: 1px solid #cdd6e7;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fcfdff;
    }

    .strand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      font-family: "Courier New", monospace;
      white-space: nowrap;
      font-size: 14px;
    }

    .line-seq {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .mid-line {
      width: 110px;
      height: 2px;
      background: #62708d;
      display: inline-block;
      margin: 0 2px;
    }

    .small-btn,
    .main-btn {
      border: 1px solid #b8c4dc;
      border-radius: 8px;
      background: #fff;
      color: #2b3654;
      cursor: pointer;
      transition: 0.2s;
    }

    .small-btn {
      padding: 6px 10px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .main-btn {
      padding: 8px 14px;
      font-size: 14px;
      background: linear-gradient(130deg, #2f6df6 0%, #4d84ff 100%);
      color: #fff;
      border-color: #2f6df6;
    }

    .small-btn:hover,
    .main-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .small-btn:disabled,
    .main-btn:disabled {
      cursor: not-allowed;
      color: #a3abc0;
      border-color: #d7ddea;
      background: #f8f9fc;
      transform: none;
    }

    .order-list {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      min-height: 36px;
      padding: 6px;
      border: 1px dashed #ccd4e6;
      border-radius: 8px;
    }

    .tag {
      border: 1px solid #aac1ff;
      background: #eff4ff;
      color: #2a57cd;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
    }

    .slider-row {
      border: 1px solid #d2dbeb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      background: #fafcff;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
    }

    select {
      margin-top: 8px;
      width: 100%;
      border: 1px solid #c8d3ea;
      border-radius: 6px;
      padding: 6px;
      font-size: 13px;
      background: #fff;
    }

    .primer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primer-option {
      border: 1px solid #cbd6ea;
      border-radius: 8px;
      padding: 10px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .primer-option.active {
      border-color: #3f74ff;
      background: #eef4ff;
      box-shadow: inset 0 0 0 1px #3f74ff;
    }

    .stage-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .template-card,
    .product-card {
      border: 1px solid #d4dced;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .template-card h4,
    .product-card h4 {
      margin: 0 0 6px;
      font-size: 13px;
      color: #3a4768;
      font-weight: 600;
    }

    .nucleotide {
      display: inline-block;
      min-width: 14px;
      text-align: center;
      margin-right: 1px;
      border-bottom: 1px solid #8ca0ca;
      line-height: 1.2;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .log-item {
      border: 1px solid #d4dced;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      background: #fafdff;
      font-size: 13px;
      line-height: 1.4;
    }

    .log-item strong {
      color: #2f6df6;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .quiz-option {
      border: 1px solid #ccd6ea;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      background: #fff;
    }

    .quiz-option.active {
      border-color: #396ff8;
      background: #ecf3ff;
    }

    .cycle-indicator {
      font-weight: 600;
      color: #375ed7;
    }

    .feedback {
      margin-top: 10px;
      min-height: 24px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid transparent;
      visibility: hidden;
    }

    .feedback.error {
      visibility: visible;
      color: var(--danger);
      background: var(--danger-bg);
      border-color: #ffc8c8;
    }

    .feedback.success {
      visibility: visible;
      color: #16633f;
      background: #f0fff6;
      border-color: #c0f1d5;
    }
  </style>
</head>
<body>
<div class="layout">
  <div class="left">
    <div class="card page-title">
      PCR 分子扩增互动实验
    </div>

    <div class="card">
      <h2>PCR 模板 DNA</h2>
      <div id="parentDna"></div>
    </div>

    <div class="card" id="orderSection">
      <h3>步骤排序</h3>
      <div>
        <button class="small-btn process-btn">变性</button>
        <button class="small-btn process-btn">退火</button>
        <button class="small-btn process-btn">聚合</button>
        <button class="small-btn" id="resetOrder">重置</button>
      </div>
      <div class="order-list" id="orderList"></div>
      <button class="main-btn" id="checkOrderBtn">进入下一步</button>
      <div class="feedback" id="orderFeedback"></div>
    </div>

    <div class="card hidden" id="conditionSection">
      <h3>步骤条件</h3>
      <div class="slider-row">
        <div class="slider-head"><span>变性</span><span id="denatureTempLabel">95°C</span></div>
        <input type="range" id="denatureTemp" min="85" max="100" value="95">
        <select id="denaturePurpose">
          <option value="">选择目的</option>
          <option value="split">双链 DNA 解开</option>
          <option value="bind">引物结合模板</option>
          <option value="extend">合成新链</option>
        </select>
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>退火</span><span id="annealTempLabel">60°C</span></div>
        <input type="range" id="annealTemp" min="40" max="75" value="60">
        <select id="annealPurpose">
          <option value="">选择目的</option>
          <option value="split">双链 DNA 解开</option>
          <option value="bind">引物结合模板</option>
          <option value="extend">合成新链</option>
        </select>
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>聚合</span><span id="extendTempLabel">72°C</span></div>
        <input type="range" id="extendTemp" min="60" max="80" value="72">
        <select id="extendPurpose">
          <option value="">选择目的</option>
          <option value="split">双链 DNA 解开</option>
          <option value="bind">引物结合模板</option>
          <option value="extend">合成新链</option>
        </select>
      </div>
      <button class="main-btn" id="checkConditionBtn">进入下一步</button>
      <div class="feedback" id="conditionFeedback"></div>
    </div>

    <div class="card hidden" id="primerSection">
      <h3>引物选择（4 选 2）</h3>
      <div class="primer-grid" id="primerGrid"></div>
      <button class="main-btn" id="checkPrimerBtn">开始第一轮循环</button>
      <div class="feedback" id="primerFeedback"></div>
    </div>

    <div class="card hidden" id="simulationSection">
      <h3>PCR 循环动画</h3>
      <div class="cycle-indicator" id="cycleIndicator">当前循环：0</div>
      <div style="margin-top: 10px;">
        <button class="main-btn" id="runFirstCycleBtn">执行第一轮</button>
        <button class="main-btn" id="nextCycleBtn" disabled>下一次循环</button>
      </div>
      <div id="stagePanel"></div>
      <div id="productPanel"></div>
    </div>

    <div class="card hidden" id="quizSection">
      <h3>PCR 结果选择题</h3>
      <div>PCR 进行 n 次循环后，DNA 分子数是：</div>
      <div class="quiz-options" id="quizOptions">
        <div class="quiz-option" data-value="2n">2n</div>
        <div class="quiz-option" data-value="2^n">2^n</div>
        <div class="quiz-option" data-value="n^2">n^2</div>
        <div class="quiz-option" data-value="n+2">n+2</div>
      </div>
      <button class="main-btn" id="submitQuizBtn">提交</button>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <h3>过程记录</h3>
      <div id="logPanel"></div>
    </div>
  </div>
</div>

<script src="./pcr-interactive.js" defer></script>
</body>
</html>
